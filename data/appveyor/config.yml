version: "{build}"
clone_depth: 1

environment:
  matrix:
    - BUILDENV: ubuntu
      SRCML: v1.0.0
      CC: ccache clang
      CXX: ccache clang++
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - BUILDENV: ubuntu
      SRCML: v1.1.0
      CC: ccache gcc
      CXX: ccache g++
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - BUILDENV: macos
      CC: ccache clang
      CXX: ccache clang++
      APPVEYOR_BUILD_WORKER_IMAGE: macos-sonoma

cache:
  - $HOME/.ccache

build_script:
  - data/appveyor/$BUILDENV.sh
